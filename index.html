<script>
/* ===================== MOTOR DE CÁLCULO (puro, sin DOM) =====================
   Toda la existencia (leche en depósitos, queso por lote/ubicación, materiales)
   se DERIVA de la colección inmutable `movs`. Nunca se guarda un saldo editable:
   así el historial es la única fuente de verdad y no puede descuadrarse. */
const EPS = 1e-6;
const r2 = v => Math.round((+v || 0) * 100) / 100;
const r3 = v => Math.round((+v || 0) * 1000) / 1000;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const dayDiff = (a, b) => Math.floor((new Date(String(b).slice(0, 10)) - new Date(String(a).slice(0, 10))) / 86400000);

function addComp(target, comp, sign) {
  for (const k in comp || {}) {
    target[k] = (target[k] || 0) + sign * comp[k];
    if (Math.abs(target[k]) < 1e-4) delete target[k];
  }
}

/* Estado de todos los saldos a partir de los movimientos */
function derive(D) {
  const leche = {}, lotes = {}, mats = {}, matByMaterial = {};
  const movsByLote = {}, movsByRecep = {}, movsByMatLote = {};
  const movs = [...D.movs.values()].sort((a, b) => (a.fecha + a.id).localeCompare(b.fecha + b.id));
  for (const m of movs) {
    if (m.ambito === 'leche') {
      // leche: saldo pendiente por entrada (recepción); va directa a cubas
      const sg = Math.sign(num(m.litros)) || 1;
      for (const rid in m.comp || {}) {
        leche[rid] = (leche[rid] || 0) + sg * m.comp[rid];
        (movsByRecep[rid] || (movsByRecep[rid] = [])).push(m);
      }
      if (m.loteId) (movsByLote[m.loteId] || (movsByLote[m.loteId] = [])).push(m);
    } else if (m.ambito === 'queso') {
      const l = lotes[m.loteId] || (lotes[m.loteId] = { piezas: 0, kg: 0, ubic: {}, vendidoP: 0, vendidoKg: 0, mermaKg: 0, mermaP: 0, entradaCamara: null });
      const p = num(m.piezas), k = num(m.kg);
      l.piezas += p; l.kg += k;
      const u = l.ubic[m.ubicId] || (l.ubic[m.ubicId] = { piezas: 0, kg: 0, desde: m.fecha });
      u.piezas += p; u.kg += k;
      if (u.piezas <= EPS && Math.abs(u.kg) < 0.001) delete l.ubic[m.ubicId];
      const t = m.tipo === 'anulacion' ? m.orig : m.tipo; // una anulación deshace el efecto del movimiento original
      if (t === 'venta' || t === 'devolucion') { l.vendidoP -= p; l.vendidoKg -= k; }
      if (t === 'merma' || t === 'perdida_peso') { l.mermaP -= p; l.mermaKg -= k; }
      (movsByLote[m.loteId] || (movsByLote[m.loteId] = [])).push(m);
    } else if (m.ambito === 'mat') {
      mats[m.matLoteId] = (mats[m.matLoteId] || 0) + num(m.cantidad);
      matByMaterial[m.materialId] = (matByMaterial[m.materialId] || 0) + num(m.cantidad);
      (movsByMatLote[m.matLoteId] || (movsByMatLote[m.matLoteId] = [])).push(m);
      if (m.loteId) (movsByLote[m.loteId] || (movsByLote[m.loteId] = [])).push(m);
    }
  }
  for (const id in leche) leche[id] = r2(leche[id]);
  for (const id in lotes) { const l = lotes[id]; l.piezas = Math.round(l.piezas); l.kg = r3(l.kg); }
  return { leche, lotes, mats, matByMaterial, movsByLote, movsByRecep, movsByMatLote };
}

/* Código de lote de la quesería: último dígito del año + día del año (3) + nº de cuba (2). Ej. 630702 */
function codigoLote(fechaISO, cubaNum) {
  const d = new Date(fechaISO.slice(0, 10) + 'T12:00:00Z');
  const ini = Date.UTC(d.getUTCFullYear(), 0, 1);
  const jul = Math.floor((d - ini) / 86400000) + 1;
  return String(d.getUTCFullYear()).slice(-1) + String(jul).padStart(3, '0') + String(cubaNum).padStart(2, '0');
}

/* Estado comercial de un lote */
function loteEstado(lote, st, variedad, reservado, hoy) {
  if (lote.anulado) return 'anulado';
  if (lote.bloqueo) return 'bloqueado';
  if (!st || (st.piezas <= 0 && st.kg <= 0.001)) return 'agotado';
  const dias = dayDiff(lote.fecha, hoy);
  if (variedad && num(variedad.diasMin) > dias) return 'maduracion';
  return 'disponible';
}

/* Reservas: pedidos abiertos con lotes asignados */
function reservas(D) {
  const res = {};
  for (const p of D.pedidos.values()) {
    if (!['pendiente', 'parcial'].includes(p.estado)) continue;
    for (const r of p.reservas || []) {
      const x = res[r.loteId] || (res[r.loteId] = { piezas: 0, kg: 0 });
      x.piezas += num(r.piezas); x.kg += num(r.kg);
    }
  }
  return res;
}

/* Análisis del mes de un ganadero: lo escrito a mano manda; si no, el informe mensual del laboratorio (LICOVAL, precios/lab-AAAA-MM), casado por REGA */
const normRega = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function granjaLab(D, pid, mes) {
  const L = D.precios && D.precios.get('lab-' + mes); const p = D.proveedores.get(pid); if (!L || !p) return null;
  const r = normRega(p.rega); return (L.granjas || []).find(g => r && normRega(g.rega) === r) || null;
}
function analisisDe(D, pid, mes) {
  const a = ((((D.precios && D.precios.get('leche')) || {})[pid] || {}).analisis || {})[mes];
  const tiene = x => x !== undefined && x !== null && x !== '';
  const g = granjaLab(D, pid, mes); const mg = a && tiene(a.grasa), mp = a && tiene(a.proteina);
  if (!g && !mg && !mp) return null;
  return { grasa: mg ? a.grasa : g?.grasa, proteina: mp ? a.proteina : g?.proteina, n: g?.n, origen: mg || mp ? (g && !(mg && mp) ? 'mixto' : 'mano') : 'lab' };
}
/* Precio de la leche de una entrada: tabla privada «precios/leche» (por ganadero y mes, o por defecto) */
function precioLeche(r, D, cfg) {
  if (!r) return 0;
  const P = ((D.precios && D.precios.get('leche')) || {})[r.proveedorId] || {};
  const m = P[String(r.fecha || '').slice(0, 7)];
  if (m !== undefined && m !== '' && m !== null) return num(m);
  const mes = String(r.fecha || '').slice(0, 7); const a = analisisDe(D, r.proveedorId, mes); const punto = num((P.puntoMes || {})[mes] ?? P.punto);
  if (a && punto) return r2((num(a.grasa) + num(a.proteina)) * punto);
  if (P.def !== undefined && P.def !== '' && P.def !== null) return num(P.def);
  const p = D.proveedores.get(r.proveedorId);
  return p && p.propio ? num(cfg.costeLechePropia) : 0;
}
/* Costes de una fabricación (se calculan al consultar; los precios no se guardan en el lote) */
function costeFabricacion({ origen, ingredientes, horas, litros }, D, cfg) {
  let leche = 0;
  for (const o of origen || []) for (const rid in o.comp || {}) leche += o.comp[rid] * precioLeche(D.recepciones.get(rid), D, cfg);
  let ing = 0, env = 0;
  for (const i of ingredientes || []) {
    const ml = D.matlotes.get(i.matLoteId); const mat = D.materiales.get(i.materialId);
    const v = num(i.cantidad) * num(ml && ml.precio);
    if (mat && ['envase', 'etiqueta', 'embalaje'].includes(mat.categoria)) env += v; else ing += v;
  }
  return { leche: r2(leche), ingredientes: r2(ing), envases: r2(env), manoObra: r2(num(horas) * num(cfg.manoObraHora)), energia: r2(num(litros) * num(cfg.energiaLitro)) };
}
function costeLote(lote, D, Dv, cfg, hoy) {
  const c = costeFabricacion({ origen: lote.origen, ingredientes: lote.ingredientes, horas: lote.horas, litros: lote.litros }, D, cfg);
  const st = Dv.lotes[lote.id];
  let fin = hoy;
  if (st && st.piezas <= 0 && st.kg <= 0.001) {
    const ms = (Dv.movsByLote[lote.id] || []).filter(m => m.ambito === 'queso');
    if (ms.length) fin = ms[ms.length - 1].fecha.slice(0, 10);
  }
  const diasMad = Math.max(0, dayDiff(lote.fecha, fin));
  c.diasMad = diasMad;
  c.maduracion = r2(num(lote.kg) * diasMad * num(cfg.maduracionKgDia));
  c.total = r2(c.leche + c.ingredientes + c.envases + c.manoObra + c.energia + c.maduracion);
  c.porKg = num(lote.kg) > 0 ? r2(c.total / num(lote.kg)) : 0;
  return c;
}

/* ---------- TRAZABILIDAD ---------- */
// Hacia atrás: lote → leche (recepciones/ganaderos) + ingredientes (lotes de proveedor)
function traceBack(loteId, D) {
  const lote = D.lotes.get(loteId); if (!lote) return null;
  const leche = {};
  for (const o of lote.origen || []) for (const rid in o.comp || {}) leche[rid] = (leche[rid] || 0) + o.comp[rid];
  const recep = Object.entries(leche).map(([rid, litros]) => {
    const r = D.recepciones.get(rid) || { id: rid }; const p = D.proveedores.get(r.proveedorId);
    return { recepcion: r, proveedor: p, litros: r3(litros) };
  }).sort((a, b) => b.litros - a.litros);

// Desde una entrada de leche: en qué lotes acabó y a qué clientes llegó
function traceRecepcion(rid, D, Dv) {

function traceMatLote(mlid, D, Dv) {

/* Integridad: comprobaciones cruzadas */
function integridad(D, Dv) {
  const errs = [];
  for (const id in Dv.leche) if (Dv.leche[id] < -0.01) errs.push(`Entrada de leche ${id}: se ha usado más leche de la recibida (${Dv.leche[id]} l)`);
  for (const id in Dv.lotes) {
    const l = Dv.lotes[id];
    if (!D.lotes.has(id)) errs.push(`Movimientos de queso de un lote inexistente: ${id}`);
    if (l.piezas < 0) errs.push(`Lote ${id}: piezas negativas (${l.piezas})`);
    for (const u in l.ubic) if (l.ubic[u].piezas < 0) errs.push(`Lote ${id}: piezas negativas en ${D.ubicaciones.get(u)?.nombre || u}`);
  }
  for (const id in Dv.mats) if (Dv.mats[id] < -0.001) errs.push(`Lote de ingrediente ${id}: existencia negativa (${r3(Dv.mats[id])})`);
  for (const a of D.albaranes.values()) for (const ln of a.lineas || []) if (ln.loteId && !D.lotes.has(ln.loteId)) errs.push(`Albarán ${a.id}: lote ${ln.loteId} inexistente`);
  for (const l of D.lotes.values()) {
    if (l.anulado) continue;
    const litrosMov = (Dv.movsByLote[l.id] || []).filter(m => m.ambito === 'leche').reduce((a, m) => a - num(m.litros), 0);
    if (Math.abs(litrosMov - num(l.litros)) > 0.5) errs.push(`Lote ${l.id}: litros declarados (${l.litros}) ≠ litros consumidos de las entradas (${r2(litrosMov)})`);
  }
  return errs;
}

/* ---------- Tablas con buscador, orden y exportación ---------- */
const TSTATE = {};
const TABLES = {};
function table({ id, cols, rows, empty = 'Sin registros', title = '', exportar = true, limit = 300, filtros = '' }) {
  const st = TSTATE[id] || (TSTATE[id] = { q: '', sort: null, dir: 1, all: false });
  const q = st.q.toLowerCase().trim();
  let data = rows;
  if (q) data = data.filter(r => cols.some(c => String(c.v ? c.v(r) : (c.f ? stripTags(c.f(r)) : r[c.k])).toLowerCase().includes(q)));
  if (st.sort != null) { const c = cols[st.sort]; data = [...data].sort(by(r => { const v = c.v ? c.v(r) : r[c.k]; return typeof v === 'number' ? v : String(v ?? '').toLowerCase(); }, st.dir)); }
  TABLES[id] = { cols, data, title };
  const shown = st.all ? data : data.slice(0, limit);
  return `<div class="tblwrap" data-tbl="${id}">
  <div class="tbar"><input type="search" class="tq" data-tq="${id}" placeholder="Buscar…" value="${esc(st.q)}">${filtros}<span class="cnt">${data.length} reg.</span>${exportar ? `<button class="btn sm" data-exp="${id}" data-fmt="xlsx">Excel</button><button class="btn sm" data-exp="${id}" data-fmt="pdf">PDF</button>` : ''}</div>
  <div class="tscroll"><table class="tbl"><thead><tr>${cols.map((c, i) => `<th data-sort="${id}" data-i="${i}" class="${c.num ? 'num' : ''}">${esc(c.l)}${st.sort === i ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
  <tbody>${shown.map(r => `<tr ${r._go ? `data-go="${esc(r._go)}" class="click"` : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">${esc(empty)}</td></tr>`}</tbody></table></div>
  ${data.length > shown.length ? `<button class="btn sm" data-tall="${id}">Mostrar los ${data.length} registros</button>` : ''}</div>`;
}
const stripTags = h => String(h).replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
function tableValues(id) { const t = TABLES[id]; return { head: t.cols.filter(c => !c.noexp).map(c => c.l), body: t.data.map(r => t.cols.filter(c => !c.noexp).map(c => { const v = c.v ? c.v(r) : (c.f ? stripTags(c.f(r)) : r[c.k]); return v ?? ''; })), title: t.title || id }; }

/* ---------- Exportación (Excel/PDF/JSON) vía capacidad de descargas ---------- */
async function guardarArchivo(nombre, data) {
  if (!S.dl) { toast('Las descargas no están disponibles en esta vista', 'err'); return; }
  try { await S.dl.save({ filename: nombre, data }); toast('Archivo preparado: ' + nombre); }
  catch (e) { if (e.code !== 'declined') toast('No se pudo guardar: ' + (e.message || e.code), 'err'); }
}
function xlsxBlob(sheets) {
  if (!window.XLSX) return null;
  const wb = XLSX.utils.book_new();
  for (const s of sheets) { const ws = XLSX.utils.aoa_to_sheet([s.head, ...s.body]); ws['!cols'] = s.head.map(() => ({ wch: 16 })); XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31).replace(/[\\/?*\[\]:]/g, ' ')); }
  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' }); return new Blob([out]);
}
function csvText(s) { return [s.head, ...s.body].map(r => r.map(v => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(';')).join('\n'); }
async function exportTable(id, fmt) {
  const t = tableValues(id); const base = `${safeSeg(t.title)}_${hoy()}`;
  if (fmt === 'xlsx') { const b = xlsxBlob([{ name: t.title, head: t.head, body: t.body }]); if (b) return guardarArchivo(base + '.xlsx', b); return guardarArchivo(base + '.csv', '﻿' + csvText(t)); }
  const doc = pdfDoc('l'); if (!doc) return;
  pdfHeader(doc, t.title);
  doc.autoTable({ head: [t.head], body: t.body.map(r => r.map(String)), startY: 28, styles: { fontSize: 7.5 }, headStyles: { fillColor: [92, 74, 40] } });
  return guardarArchivo(base + '.pdf', doc.output('blob'));
}
function pdfDoc(orient = 'p', format = 'a4') {
  if (!window.jspdf) { toast('El generador de PDF no se ha cargado (sin conexión a la librería)', 'err'); return null; }
  return new jspdf.jsPDF({ orientation: orient, unit: 'mm', format });
}
function pdfHeader(doc, titulo) {
  const c = cfg(); doc.setFontSize(13); doc.text(c.nombre || 'Quesería', 14, 14); doc.setFontSize(10);
  doc.text(titulo, 14, 21); doc.setFontSize(8); doc.text(`Generado ${F.dt(localISO())}`, doc.internal.pageSize.getWidth() - 14, 14, { align: 'right' });
}

/* ---------- ALERTAS (compartidas por panel y calidad) ---------- */
function alertas() {
  const A = []; const dv = DV(); const c = cfg(); const h = hoy();
  // Cámaras: última lectura fuera de rango o sin lectura hoy
  for (const u of D.ubicaciones.values()) {
    if (u.tipo !== 'camara' || u.inactivo) continue;
    const regs = [...D.camreg.values()].filter(r => r.ubicId === u.id && r.tipo === 'ambiente').sort(by('fecha', -1));
    const r = regs[0];
    if (r) {
      if ((u.tempMin !== '' && u.tempMin != null && num(r.temp) < num(u.tempMin)) || (u.tempMax !== '' && u.tempMax != null && num(r.temp) > num(u.tempMax))) A.push(['bad', `${u.nombre}: temperatura ${F.n(r.temp, 1)} °C fuera de rango (${F.dt(r.fecha)})`, '#cam-' + u.id]);
      if (r.hum !== '' && ((u.humMin !== '' && u.humMin != null && num(r.hum) < num(u.humMin)) || (u.humMax !== '' && u.humMax != null && num(r.hum) > num(u.humMax)))) A.push(['warn', `${u.nombre}: humedad ${F.n(r.hum, 0)} % fuera de rango`, '#cam-' + u.id]);
      if (r.fecha.slice(0, 10) < h) A.push(['warn', `${u.nombre}: sin registro de temperatura hoy`, '#cam-' + u.id]);
    } else A.push(['warn', `${u.nombre}: sin registros de temperatura`, '#cam-' + u.id]);
  }
  // Volteos/revisión pendientes y lotes que alcanzan maduración
  for (const l of D.lotes.values()) {
    if (l.anulado) continue; const st = dv.lotes[l.id]; if (!st || st.piezas <= 0) continue;
    const v = D.variedades.get(l.variedadId); if (!v) continue;
    const dias = dayDiff(l.fecha, h);
    const enCamara = Object.keys(st.ubic).some(u => D.ubicaciones.get(u)?.tipo === 'camara');
    if (enCamara && num(v.volteoDias) > 0) {
      const ult = [...D.camreg.values()].filter(r => (r.loteIds || []).includes(l.id) && ['volteo', 'lavado', 'tratamiento', 'revision'].includes(r.tipo)).sort(by('fecha', -1))[0];
      const desde = ult ? ult.fecha : l.fecha;
      if (dayDiff(desde, h) >= num(v.volteoDias)) A.push(['warn', `Lote ${l.id}: revisión/volteo pendiente (cada ${v.volteoDias} días; último ${F.d(desde)})`, '#lote-' + l.id]);
    }
    if (num(v.diasMin) > 0 && dias === num(v.diasMin)) A.push(['info', `Lote ${l.id} (${v.nombre}) alcanza hoy su maduración mínima`, '#lote-' + l.id]);
    if (num(v.vidaUtil) > 0 && dias > num(v.vidaUtil)) A.push(['bad', `Lote ${l.id}: superada la vida útil (${v.vidaUtil} días) con ${st.piezas} piezas en stock`, '#lote-' + l.id]);
    if (l.bloqueo) A.push(['bad', `Lote ${l.id} BLOQUEADO: ${l.bloqueo.motivo}`, '#lote-' + l.id]);
  }
  // Stock bajo de queso por variedad
  for (const v of D.variedades.values()) {
    if (v.inactivo || !num(v.stockMinKg)) continue;
    const kg = sum([...D.lotes.values()].filter(l => l.variedadId === v.id && !l.anulado && !l.bloqueo), l => dv.lotes[l.id]?.kg || 0);
    if (kg < num(v.stockMinKg)) A.push(['warn', `Stock bajo de ${v.nombre}: ${F.kg(kg)} (mínimo ${F.kg(v.stockMinKg)})`, '#stock']);
  }
  // Ingredientes: bajo mínimo y caducidades
  for (const m of D.materiales.values()) {
    if (m.inactivo || !num(m.stockMin)) continue; const ex = dv.matByMaterial[m.id] || 0;
    if (ex < num(m.stockMin)) A.push(['warn', `${m.nombre}: existencias ${F.n(ex, 2)} ${m.unidad} (mínimo ${m.stockMin})`, '#stock']);
  }
  for (const ml of D.matlotes.values()) {
    const ex = dv.mats[ml.id] || 0; if (ex <= 0.0001 || !ml.caducidad) continue;
    const d = dayDiff(h, ml.caducidad);
    if (d < 0) A.push(['bad', `${nombre('materiales', ml.materialId)} lote ${ml.loteProv || ml.id}: CADUCADO (${F.d(ml.caducidad)})`, '#ml-' + ml.id]);
    else if (d <= 15) A.push(['warn', `${nombre('materiales', ml.materialId)} lote ${ml.loteProv || ml.id}: caduca el ${F.d(ml.caducidad)}`, '#ml-' + ml.id]);
  }
  // Leche sin elaborar demasiado tiempo
  const maxD = num(c.lecheMaxDias);
  if (maxD) for (const rid in dv.leche) { const r = D.recepciones.get(rid); if (r && dv.leche[rid] > 0.5 && dayDiff(r.fecha, h) > maxD) A.push(['warn', `Leche sin elaborar: ${rid} (${nombre('proveedores', r.proveedorId)}) quedan ${F.l(dv.leche[rid])} desde ${F.d(r.fecha)}`, '#recep-' + rid]); }
  // Cubas: limpieza
  const dLim = num(c.limpiezaDias);
  for (const cu of D.cubas.values()) {
    if (cu.inactivo || !dLim) continue;
    const ult = [...D.limpiezas.values()].filter(x => x.objetoTipo === 'cuba' && x.objetoId === cu.id).sort(by('fecha', -1))[0];
    if (!ult || dayDiff(ult.fecha, h) > dLim) A.push(['warn', `Cuba ${cu.nombre}: limpieza pendiente (última ${ult ? F.d(ult.fecha) : 'nunca'})`, '#calidad']);
  }
  // Calidad
  for (const q of D.calidad.values()) {
    if (q.tipo === 'nc' && q.estado !== 'cerrada') A.push(['bad', `No conformidad abierta: ${q.descripcion?.slice(0, 80)}`, '#calidad']);
    if (q.tipo === 'documento' && q.caducidad) { const d = dayDiff(h, q.caducidad); if (d <= 30) A.push([d < 0 ? 'bad' : 'warn', `Documento «${q.titulo}» ${d < 0 ? 'caducado' : 'caduca'} el ${F.d(q.caducidad)}`, '#calidad']); }
  }
  // Cobros vencidos
  if (puede('ventas')) for (const a of D.albaranes.values()) if (a.tipo === 'venta' && !a.anulado && !a.cobro && a.vencimiento && a.vencimiento < h) A.push(['warn', `Cobro vencido: albarán ${a.id} · ${nombre('clientes', a.clienteId)} · ${F.eur(a.total)}`, '#alb-' + a.id]);
  const ord = { bad: 0, warn: 1, info: 2 };
  return A.sort((a, b) => ord[a[0]] - ord[b[0]]);
}

ACT.trasladoLote = id => {
  const uo = ubicStockOpts(id);

    title: 'Trasladar lote ' + id, values: { desde: uo[0]?.[0] || '', piezas: DV().lotes[id]?.ubic?.[uo[0]?.[0]]?.piezas || '' },
    fields: [{ k: 'desde', l: 'Desde', t: 'select', opts: uo, req: 1 }, { k: 'hasta', l: 'Hasta', t: 'select', opts: () => ubicOpts(), req: 1 }, { k: 'piezas', l: 'Piezas', t: 'number', req: 1, min: 1, step: 1 }, { k: 'kg', l: 'Kg (vacío = proporcional)', t: 'number' }, { k: 'nota', l: 'Observaciones' }],
    async onSubmit(v) {
      if (v.desde === v.hasta) throw new Error('Origen y destino iguales');
      const x = DV().lotes[id].ubic[v.desde]; const p = Math.round(num(v.piezas));

      const g = newId('G');
      await addMov({ ambito: 'queso', tipo: 'traslado_out', loteId: id, ubicId: v.desde, piezas: -p, kg: -kg, grupo: g, nota: v.nota });
      await addMov({ ambito: 'queso', tipo: 'traslado_in', loteId: id, ubicId: v.hasta, piezas: p, kg, grupo: g, nota: v.nota });
      if (p === x.piezas && Math.abs(x.kg - kg) > 0.0005) await addMov({ ambito: 'queso', tipo: 'perdida_peso', loteId: id, ubicId: v.desde, piezas: 0, kg: -(x.kg - kg), nota: 'Ajuste de peso al trasladar' });

  await put('lotes', id, { ...l, bloqueo: null, historialBloqueos: [...(l.historialBloqueos || []), { ...l.bloqueo, fin: localISO(), resolucion: motivo, finUsuario: S.uid }] }, 'desbloquear', motivo);
  const q = D.calidad.get(l.bloqueo?.ncId); if (q) await put('calidad', q.id, { ...q, estado: 'cerrada', accion: motivo, fechaCierre: localISO() }, 'cerrar NC');
  toast('Lote desbloqueado');
};
ACT.anularLote = async id => {
  const l = D.lotes.get(id); const dv = DV();
  const ms = (dv.movsByLote[id] || []).filter(m => m.ambito === 'queso');
  if (ms.some(m => m.tipo !== 'produccion')) return toast('No se puede anular: el lote ya tiene traslados, ventas o mermas. Usa merma o ajuste.', 'err');
  const motivo = await pedirTexto('Anular fabricación ' + id, 'Motivo (error de registro). Se devolverá la leche a sus entradas y los ingredientes a sus lotes.'); if (!motivo) return;
  for (const m of dv.movsByLote[id] || []) {
    if (m.ambito === 'leche') await addMov({ ambito: 'leche', tipo: 'anulacion', litros: -num(m.litros), comp: m.comp, loteId: id, nota: motivo });
    if (m.ambito === 'mat') await addMov({ ambito: 'mat', tipo: 'anulacion', matLoteId: m.matLoteId, materialId: m.materialId, cantidad: -num(m.cantidad), loteId: id, nota: motivo });
    if (m.ambito === 'queso') await addMov({ ambito: 'queso', tipo: 'anulacion', orig: m.tipo, loteId: id, ubicId: m.ubicId, piezas: -num(m.piezas), kg: -num(m.kg), nota: motivo });
  }
  await put('lotes', id, { ...l, anulado: { motivo, fecha: localISO(), usuario: S.uid } }, 'anular lote', motivo);
  toast('Fabricación anulada');
};

/* ===================== VISTAS 3: ventas, expediciones, clientes, compras ===================== */
const precioDe = (clienteId, variedadId) => { const c = D.clientes.get(clienteId); const t = (c?.tarifas || []).find(x => x.variedadId === variedadId); return t && t.precio !== '' ? num(t.precio) : num(D.variedades.get(variedadId)?.precio); };
const unidadDe = variedadId => D.variedades.get(variedadId)?.unidadPrecio || 'kg';
const importeLinea = ln => r2((unidadDe(ln.variedadId || D.lotes.get(ln.loteId)?.variedadId) === 'ud' ? num(ln.piezas) : num(ln.kg)) * num(ln.precio) * (1 - num(ln.dto) / 100));
function totales(lineas) {
  const porIva = {}; for (const l of lineas) { const b = importeLinea(l); const k = num(l.iva); porIva[k] = (porIva[k] || 0) + b; }
  const base = r2(sum(Object.values(porIva), x => x)); const cuota = r2(sum(Object.entries(porIva), ([k, b]) => b * num(k) / 100));
  return { base, cuota, total: r2(base + cuota), porIva };
}
const totalesHtml = lineas => { const t = totales(lineas); return `<div class="calcbox">Base: <b>${F.eur(t.base)}</b> · ${Object.entries(t.porIva).map(([k, b]) => `IVA ${k}%: ${F.eur(b * num(k) / 100)}`).join(' · ')} · Total: <b>${F.eur(t.total)}</b></div>`; };
const lotesVendibles = (incluir) => { const dv = DV(); const h = hoy(); return [...D.lotes.values()].filter(l => !l.anulado && ((dv.lotes[l.id]?.piezas || 0) > 0 || l.id === incluir)).sort(by('fecha')).map(l => { const v = D.variedades.get(l.variedadId); const e = loteEstado(l, dv.lotes[l.id], v, null, h); return [l.id, `${l.id} · ${v?.nombre || ''} · ${dv.lotes[l.id]?.piezas || 0} pz / ${F.n(dv.lotes[l.id]?.kg || 0, 1)} kg${e === 'bloqueado' ? ' · BLOQUEADO' : e === 'maduracion' ? ' · en maduración' : ''}`]; }); };

/* Asignación automática de lotes: el más antiguo disponible primero (FIFO) */
function asignarFIFO(variedadId, piezas, pedidoId) {
  const dv = DV(); const h = hoy(); const out = []; let falta = Math.round(num(piezas));
  const mias = new Set((D.pedidos.get(pedidoId)?.reservas || []).map(r => r.loteId));
  const res = reservas(D);
  const cand = [...D.lotes.values()].filter(l => l.variedadId === variedadId && loteEstado(l, dv.lotes[l.id], D.variedades.get(variedadId), null, h) === 'disponible').sort((a, b) => (mias.has(b.id) - mias.has(a.id)) || a.fecha.localeCompare(b.fecha));
  for (const l of cand) {
    if (falta <= 0) break;
    const reservadoOtros = mias.has(l.id) ? 0 : (res[l.id]?.piezas || 0);
    let libre = (dv.lotes[l.id].piezas || 0) - reservadoOtros;
    for (const [u, x] of Object.entries(dv.lotes[l.id].ubic)) {
      if (falta <= 0 || libre <= 0) break; const p = Math.min(falta, x.piezas, libre); if (p <= 0) continue;
      out.push({ loteId: l.id, ubicId: u, piezas: p, kg: r3(x.kg * p / x.piezas) }); falta -= p; libre -= p;
    }
  }
  return { lineas: out, falta };
}

        const key = ln.loteId + '|' + ln.ubicId; const u = usado[key] || (usado[key] = { p: 0, kg: 0 }); u.p += Math.round(num(ln.piezas)); u.kg += num(ln.kg);

      const fecha = v.fecha + 'T' + localISO().slice(11);
      for (const ln of L) await addMov({ fecha, ambito: 'queso', tipo: 'venta', loteId: ln.loteId, ubicId: ln.ubicId, piezas: -ln.piezas, kg: -ln.kg, ref: { col: 'albaranes', id } });

    }

/* Si una ubicación se queda sin piezas, el peso residual (diferencias de pesada) se ajusta a cero */
async function cerrarRestos(keys, fecha, ref) {
  const dv = DV();
  for (const k of keys) { const [lid, u] = k.split('|'); const x = dv.lotes[lid]?.ubic[u]; if (x && x.piezas === 0 && Math.abs(x.kg) > 0.0005) await addMov({ fecha, ambito: 'queso', tipo: x.kg > 0 ? 'perdida_peso' : 'ajuste', loteId: lid, ubicId: u, piezas: 0, kg: -r3(x.kg), ref, nota: 'Diferencia de peso al vaciar la ubicación' }); }

/* Unidades pedidas por un cliente en un mes (AAAA-MM), por producto: de los pedidos de la semana; si ese mes no hay, de los albaranes */
function udsCliente(cid, mes) {
  const r = {}; let plan = false;
  for (const x of D.plansem.values()) { if (!x.semana || !x.c || !String(x.semana).startsWith(mes)) continue; const u = num(x.c[cid]?.u); if (u) { r[x.variedadId] = (r[x.variedadId] || 0) + u; plan = true; } }
  if (!plan) for (const a of D.albaranes.values()) if (a.clienteId === cid && !a.anulado && String(a.fecha).startsWith(mes)) { const sg = a.tipo === 'devolucion' ? -1 : 1; for (const l of a.lineas || []) r[l.variedadId] = (r[l.variedadId] || 0) + sg * num(l.piezas); }
  return r;
}

function histRows(tipo) {
  if (_hr.ver !== S.ver) { _hr.ver = S.ver; _hr.c = {}; }
  if (_hr.c[tipo]) return _hr.c[tipo];
  let rows = [...D.historico.values()].filter(h => h.tipo === tipo).flatMap(h => h.rows || []);
  if (tipo === 'recep' || tipo === 'queso') {
    const ac = rows.filter(r => r.src !== 'excel'), xl = rows.filter(r => r.src === 'excel');
    if (tipo === 'recep') { const kp = r => String(r.f || '').slice(0, 10) + '|' + String(r.p || '').toUpperCase().slice(0, 4); const ks = new Set(ac.map(kp)); rows = [...ac, ...xl.filter(r => !ks.has(kp(r)))]; }

      rows = [...acc, ...extra]; }
  }
  return (_hr.c[tipo] = rows);
}

const UNID_USO = [['ml', 'ml (= cc)'], ['l', 'litros'], ['g', 'gramos'], ['kg', 'kg'], ['ud', 'unidades'], ['dosis', 'dosis / sobres'], ['m', 'metros']];
const UNID_COMPRA = [...UNID_USO, ['garrafa', 'garrafas'], ['bote', 'botes'], ['saco', 'sacos'], ['caja', 'cajas'], ['rollo', 'rollos']];
const unidTxt = u => (UNID_COMPRA.find(x => x[0] === u) || [u, u])[1];
const factorAuto = (de, a) => ({ 'l>ml': 1000, 'kg>g': 1000, 'ml>l': 0.001, 'g>kg': 0.001 })[de + '>' + a] || (de === a ? 1 : 0);
/* Tamaño de la unidad de compra en palabras: «garrafas de 5 l», «sacos de 25 kg» */
const tamTxt = (f, u) => u === 'ml' && f >= 1000 ? F.n(f / 1000) + ' l' : u === 'g' && f >= 1000 ? F.n(f / 1000) + ' kg' : F.n(f) + ' ' + unidTxt(u);

function unidadesEntrada(m) { if (!m) return []; const f = factorMat(m); const out = []; if (m.unidadCompra && m.unidadCompra !== m.unidad && f) out.push(['compra', compraTxt(m), f]);
  out.push(['gasto', unidTxt(m.unidad), 1]); if (m.unidad === 'ml') for (const L of [5, 25]) if (!(m.unidadCompra === 'garrafa' && f === L * 1000)) out.push(['g' + L, `garrafas de ${L} l`, L * 1000]); if (m.unidad === 'ml' && m.unidadCompra !== 'l') out.push(['l', 'litros', 1000]); if (m.unidad === 'g' && m.unidadCompra !== 'kg') out.push(['kg', 'kg', 1000]); return out; }

/* Importación del histórico del Access */
ACT.importarIncluido = async () => { const msg = $('#impMsg'); msg.textContent = 'Descargando histórico…'; try { const r = await fetch('historico_access.json'); if (!r.ok) throw new Error('HTTP ' + r.status); await importarAccess(await r.blob()); } catch (e) { msg.textContent = 'No se pudo cargar el histórico incluido: ' + e.message + '. Usa la opción de subir archivo.'; } };
async function importarAccess(file) {
  const msg = $('#impMsg'); if (!file) return;
  let J; try { J = JSON.parse(await file.text()); } catch (e) { msg.textContent = 'Archivo no válido'; return; }
  if (J.formato !== 'hoya-access-v1') { msg.textContent = 'No es el archivo de histórico esperado'; return; }
  const M = J.maestros; const nuevosProv = M.proveedores.filter(p => ![...D.proveedores.values()].some(x => x.nombre.toUpperCase() === p.nombre.toUpperCase()));
  const nuevosProd = M.productos.filter(p => ![...D.variedades.values()].some(x => x.nombre.toUpperCase() === p.nombre.toUpperCase()));
  const nuevasCubas = M.cubas.filter(c => ![...D.cubas.values()].some(x => num(x.numero) === c.numero));
  if (!(await confirmar(`Se importará:<br>· ${nuevosProv.length} proveedores, ${nuevosProd.length} productos, ${nuevasCubas.length} cubas y ${M.operarios.length} operarios (los que ya existen no se duplican)<br>· Histórico: ${J.chunks.reduce((a, c) => a + c.rows.length, 0).toLocaleString('es-ES')} registros en ${J.chunks.length} bloques de solo lectura`, 'Importar'))) return;
  try {
    for (const p of nuevosProv) { msg.textContent = 'Proveedores…'; await put('proveedores', newId('V'), { nombre: p.nombre, tipos: ['leche'], tipoLeche: p.tipoLeche, propio: p.propio, origen: 'access' }, 'importar'); }
    for (const p of nuevosProd) { msg.textContent = 'Productos…'; await put('variedades', newId('P'), { nombre: p.nombre, categoria: p.categoria, unidadPrecio: p.categoria === 'lacteo' ? 'ud' : 'kg', tipoLeche: 'cabra', inactivo: p.inactivo, origen: 'access' }, 'importar'); }
    for (const c of nuevasCubas) await put('cubas', newId('U'), { ...c, origen: 'access' }, 'importar');
    const antes = new Set(S.data.config.get('operarios')?.lista || []); const ops = new Set([...antes, ...M.operarios]); await put('config', 'operarios', { ...(S.data.config.get('operarios') || {}), lista: [...ops].sort(), deAccess: [...new Set([...(S.data.config.get('operarios')?.deAccess || []), ...M.operarios.filter(o => !antes.has(o))])] }, 'importar');
    let i = 0; for (const ch of J.chunks) { msg.textContent = `Histórico ${++i}/${J.chunks.length}…`; await S.db.doc('historico/' + ch.id).set({ tipo: ch.tipo, rows: ch.rows }); await sleep(150); }
    msg.textContent = 'Importación completada ✓'; toast('Histórico importado'); S.ver++; scheduleRender();
  } catch (e) { msg.textContent = 'Error: ' + (e.message || e.code); }
}
/* Deshacer la importación del Access: histórico + maestros creados por ella que no se hayan usado */
ACT.quitarAccess = async () => {
  if (!S.isOwner && S.rol !== 'admin') throw new Error('Solo el administrador');
  const usado = (campo, id) => [...D.recepciones.values(), ...D.lotes.values(), ...D.albaranes.values(), ...D.pedidos.values(), ...D.matlotes.values()].some(x => x[campo] === id || (x.lineas || []).some(l => l[campo] === id)) || [...D.movs.values()].some(m => m[campo] === id);
  const provs = [...D.proveedores.values()].filter(p => p.origen === 'access'), prods = [...D.variedades.values()].filter(p => p.origen === 'access'), cubas = [...D.cubas.values()].filter(c => c.origen === 'access');
  const bProv = provs.filter(p => !usado('proveedorId', p.id)), bProd = prods.filter(p => !usado('variedadId', p.id)), bCub = cubas.filter(c => !usado('cubaId', c.id));
  const opsCfg = S.data.config.get('operarios') || {}; const deAcc = new Set(opsCfg.deAccess || []);
  const usadosOp = new Set([...D.recepciones.values(), ...D.lotes.values()].flatMap(x => [x.operario, ...(x.operarios || [])]).filter(Boolean));
  const bOps = [...deAcc].filter(o => !usadosOp.has(o));
  const quedan = (provs.length - bProv.length) + (prods.length - bProd.length) + (cubas.length - bCub.length);
  if (!(await confirmar(`Se borrará:<br>· el histórico del Access (${S.data.historico.size} bloques)<br>· ${bProv.length} ganaderos, ${bProd.length} productos, ${bCub.length} cubas y ${bOps.length} operarios creados al importar${quedan ? `<br>Se quedan ${quedan} porque ya los usáis en la app.` : ''}<br><b>No se puede deshacer.</b> ¿Seguir?`, 'Borrar', true))) return;
  const msg = $('#impMsg'); let k = 0;

  if (typeof xlRows === 'function') {

    const xd = xlRows('diario').filter(x => x.f.slice(0, 7) === mes).sort(by('f'));

  }
  let saldo = apertura, tanque = aperturaSuero;
  for (const d of dias) {
    d.disponible = saldo + d.entrada + d.entradaVaca;
    saldo = d.disponible - d.fabCabra - d.fabVaca + d.otros; d.diferencia = r2(saldo);

/* ---------- Hoja del mes editable: escribir litros crea / corrige / anula la entrada de leche ---------- */
async function hojaCelda(pid, fecha, valor) {
  const nuevo = num(String(valor).replace(',', '.')); const p = D.proveedores.get(pid); if (!p) return;
  const recs = [...D.recepciones.values()].filter(r => r.proveedorId === pid && !r.anulada && r.estado === 'aceptada' && r.fecha.slice(0, 10) === fecha);
  if (recs.length > 1) throw new Error('Ese día hay varias entradas de este ganadero: corrígelas en Entradas.');
  if (fecha > hoy()) throw new Error('La fecha no puede ser futura.');
  if (!recs.length) {
    if (!(nuevo > 0)) return;
    const f = fecha === hoy() ? localISO() : fecha + 'T08:00'; const n = await nextNum('rec-' + yymmdd(f)); const id = `R${yymmdd(f)}-${pad(n)}`;
    const t = cfg().tempRecepcionDefecto; await put('recepciones', id, { fecha: f, proveedorId: pid, tipoLeche: p.tipoLeche || 'cabra', litros: nuevo, temp: t === '' || t == null ? 4 : num(t), operario: '', albaran: '', analisis: { antibioticos: 'neg', aspecto: 'ok' }, transporte: {}, estado: 'aceptada', incidencias: '', hoja: true }, 'recepción (hoja)', `${nuevo} l de ${p.nombre}`);
    await addMov({ fecha: f, ambito: 'leche', tipo: 'recepcion', litros: nuevo, comp: { [id]: nuevo }, ref: { col: 'recepciones', id } });
    return `Entrada ${id}: ${F.l(nuevo)} de ${aliasProv(p)}`;
  }
  const r = recs[0]; const usado = r2(num(r.litros) - (DV().leche[r.id] || 0));
  if (nuevo < usado - 0.01) throw new Error(`De la entrada ${r.id} ya se han fabricado ${F.l(usado)}; no puede bajar de ahí.`);
  if (!(nuevo > 0)) {
    await addMov({ ambito: 'leche', tipo: 'anulacion', litros: -num(r.litros), comp: { [r.id]: num(r.litros) }, ref: { col: 'recepciones', id: r.id }, nota: 'Borrada en la hoja del mes' });
    await put('recepciones', r.id, { ...r, anulada: { motivo: 'Borrada en la hoja del mes', fecha: localISO(), usuario: S.uid } }, 'anular', 'hoja del mes');
    return `Entrada ${r.id} anulada`;
  }
  const diff = r2(nuevo - num(r.litros)); if (!diff) return;
  await addMov({ fecha: r.fecha, ambito: 'leche', tipo: 'ajuste', litros: diff, comp: { [r.id]: Math.abs(diff) }, ref: { col: 'recepciones', id: r.id }, nota: `Corregido en la hoja del mes: ${F.n(r.litros)} → ${F.n(nuevo)} l` });
  await put('recepciones', r.id, { ...r, litros: nuevo }, 'corregir litros (hoja)', `${r.litros} → ${nuevo} l`);
  return `Entrada ${r.id} corregida a ${F.l(nuevo)}`;
}
async function hojaPrecio(campo, pid, mes, valor) {
  const P = clone(S.data.precios.get('leche') || {}); const pp = P[pid] || (P[pid] = {}); const v = String(valor).trim() === '' ? '' : num(String(valor).replace(',', '.'));
  if (campo === 'precio') { if (v === '') delete pp[mes]; else pp[mes] = v; }

  else { pp.analisis = pp.analisis || {}; const a = { ...(pp.analisis[mes] || {}) }; if (v === '') delete a[campo]; else a[campo] = v; if (Object.keys(a).length) pp.analisis[mes] = a; else delete pp.analisis[mes]; }

const provPorNombre = n => { const ps = [...D.proveedores.values()].filter(p => (p.tipos || []).includes('leche') || !p.tipos); const N = String(n || '').toUpperCase(); return ps.find(p => p.nombre.toUpperCase() === N) || (RX_GAN[N] && ps.find(p => RX_GAN[N].test(p.nombre))); };

  const lista = [...(D.plansem.get(vid + '_clientes')?.lista || [])];

  await put('plansem', vid + '_clientes', { variedadId: vid, lista }, 'importar Excel', 'clientes de tiernos');
  for (const s of J.plan) {

    const c = {}; for (const [n, x] of Object.entries(s.c)) { const k = cliPorNombre(n); if (k) c[k.id] = { u: x.u, est: s.sem < lunesDe(hoy()) ? 'preparado' : '', conf: !!x.conf, nota: x.nota || '' }; }
    await put('plansem', id, { variedadId: vid, semana: s.sem, c, src: 'excel' }, 'importar Excel', 'pedidos ' + s.sem);

  const tipos = [['recep', J.recep], ['queso', J.queso], ['diario', J.diario], ['env', J.env], ['ped', J.ped], ['tiernos', J.tiernos], ['parc', J.parc]];
  for (const [tipo, rows] of tipos) { const T = trozos(rows || []); for (let i = 0; i < T.length; i++) await put('historico', `x-${tipo}-${i}`, { tipo, rows: T[i], src: 'excel' }, 'importar Excel', `${tipo} ${i + 1}/${T.length}`); }

/* ===================== HOJA DE FABRICACIÓN DE LA SEMANA (como «DATOS DE FABRICACIÓN») =====================
   Se rellena igual que el Excel: cada día, una fila por cuba con CUBA · LITROS · QUESO · FABRICAMOS.
   Al guardar la fila se crea el lote (fecha + cuba), se descuenta la leche de las entradas más antiguas
   (la PROCEDENCIA sale sola: «HOYA J 100 + VILLA 895»), se descuentan los ingredientes de la receta y entra el stock. */
const DIAS_HOJA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const piezasDe = fab => { const t = String(fab || ''); const n = t.match(/\d+(?:[.,]\d+)?/g) || []; return Math.round(sum(n, x => num(String(x).replace(',', '.')))); };
/* Leche sin elaborar, de la entrada más antigua a la más nueva, hasta cubrir los litros */
function lecheFIFO(litros, hasta) {
  const dv = DV(); const out = []; let falta = num(litros);
  const recs = [...D.recepciones.values()].filter(r => !r.anulada && r.estado === 'aceptada' && (dv.leche[r.id] || 0) > 0.5 && r.fecha.slice(0, 10) <= hasta).sort(by(r => r.fecha + r.id));
  for (const r of recs) { if (falta <= 0.001) break; const n = r2(Math.min(dv.leche[r.id], falta)); out.push({ recepcionId: r.id, litros: n }); falta = r2(falta - n); }
  return { origen: out, falta: Math.max(0, falta), hay: r2(sum(recs, r => dv.leche[r.id])) };
}
const procTexto = origen => procedencia({ origen });
/* Ingredientes de la receta para esos litros, con el lote más antiguo que tenga existencias */
function ingredientesAuto(variedadId, litros) {
  const rec = (D.variedades.get(variedadId)?.receta || []).filter(x => x.materialId); const out = [], faltan = []; const dv = DV(); const usado = {};
  for (const x of rec) {
    const mid = elegirRotacion(variedadId, x); const d = dosisDe(variedadId, mid); if (d == null) continue;
    const q = cantidadPara(mid, d, litros); if (!(q > 0)) continue;
    const ml = matLoteOpts(mid).map(o => o[0]).find(id => (dv.mats[id] || 0) - (usado[id] || 0) >= q - 1e-6);
    if (!ml) { faltan.push(nombre('materiales', mid)); continue; }
    usado[ml] = (usado[ml] || 0) + q; out.push({ materialId: mid, matLoteId: ml, cantidad: q });
  }
  return { ingr: out, faltan };
}
async function fabricarDesdeHoja({ fecha, cubaId, litros, variedadId, fab }) {
  if (!fecha || fecha > hoy()) throw new Error('La fecha no puede ser futura');
  const cuba = D.cubas.get(cubaId); if (!cuba) throw new Error('Elige la cuba');
  const vari = D.variedades.get(variedadId); if (!vari) throw new Error('Elige el queso');
  litros = num(litros); if (!(litros > 0)) throw new Error('Pon los litros');
  const L = lecheFIFO(litros, fecha);
  if (L.falta > 0.5) throw new Error(`Solo hay ${F.l(L.hay)} de leche sin elaborar hasta ese día. Faltan ${F.l(L.falta)}: registra antes la entrada de leche.`);
  const { ingr, faltan } = ingredientesAuto(variedadId, litros);
  const piezas = piezasDe(fab), kg = 0; /* sin pesar: los kilos se ponen al pesar el lote */
  const id = loteLibre(fecha, cuba.numero, loteOcupado).id;
  const origen = L.origen.map(o => ({ recepcionId: o.recepcionId, litros: o.litros, comp: { [o.recepcionId]: o.litros } }));
  const ubic = opts('ubicaciones', u => u.tipo === 'camara')[0]?.[0] || opts('ubicaciones')[0]?.[0] || '';
  const tipoLeche = [...new Set(origen.map(o => D.recepciones.get(o.recepcionId)?.tipoLeche))].join('+');
  const pasos = (vari.pasos || []).slice();
  const lote = { fecha, cubaId, variedadId, tipoLeche, ubicIdInicial: ubic, operarios: [], horas: 0, origen, litros, ingredientes: ingr, receta: pasos.length ? { pasos, segun: true, cambios: '' } : null, piezas, kg, sinPesar: true, fab: String(fab || ''), hoja: true, obs: faltan.length ? 'Sin lote de: ' + faltan.join(', ') : '' };
  const ts = fecha + 'T' + localISO().slice(11);
  await put('lotes', id, lote, 'fabricación (hoja)', `${piezas} pz`);
  for (const o of origen) await addMov({ fecha: ts, ambito: 'leche', tipo: 'consumo', litros: -o.litros, comp: o.comp, loteId: id, ref: { col: 'lotes', id } });
  for (const i of ingr) await addMov({ fecha: ts, ambito: 'mat', tipo: 'consumo', matLoteId: i.matLoteId, materialId: i.materialId, cantidad: -i.cantidad, loteId: id, ref: { col: 'lotes', id } });
  await addMov({ fecha: ts, ambito: 'queso', tipo: 'produccion', loteId: id, ubicId: ubic, piezas, kg, ref: { col: 'lotes', id } });
  return { id, faltan };
}

const camaraPermitida = () => { try { if (!navigator.mediaDevices?.getUserMedia) return false; const fp = document.permissionsPolicy || document.featurePolicy; return fp ? fp.allowsFeature('camera') : true; } catch { return false; } };
/* Abre el lector y devuelve lo leído (o null si se cancela) */
function leerCodigo({ titulo = 'Escanear código', ayuda = '' } = {}) {
  return new Promise(res => {
    let fin = false, parar = () => { };
    const cam = camaraPermitida();
    const m = modal(`<h3>${esc(titulo)}</h3>${ayuda ? `<p class="sub">${ayuda}</p>` : ''}
      <form class="lector" novalidate>
        <label for="lectorIn">Pasa el lector por el código, o escríbelo</label>
        <div class="lrow"><input id="lectorIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código o lote…"><button class="btn primary" type="submit">Usar</button></div>
      </form>
      <div class="lfoto"><label class="btn big">📷 Hacer foto al código<input type="file" accept="image/*" capture="environment" hidden></label><label class="btn">🖼 Elegir una foto<input type="file" accept="image/*" hidden></label></div>
      <p class="lmsg sub">Lee códigos de barras, QR y los cuadrados (DataMatrix) de los envases. Foto de cerca, recta y con buena luz.</p>
      ${cam ? '<div class="lcam" hidden><div id="lectorCam"></div></div>' : ''}`, { onClose: () => { parar(); if (!fin) res(null); } });
    const acabar = code => { code = String(code ?? '').trim(); if (!code || fin) return; fin = true; parar(); res(code); m.close(); };
    const inp = m.querySelector('#lectorIn'); setTimeout(() => inp.focus(), 30);
    m.querySelector('form').addEventListener('submit', e => { e.preventDefault(); acabar(inp.value); });
    const msg = m.querySelector('.lmsg');
    m.querySelectorAll('input[type=file]').forEach(fi => fi.addEventListener('change', async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      msg.textContent = 'Leyendo la foto…'; msg.classList.remove('err');
      const r = await leerFoto(f, t => { msg.textContent = t; });
      if (r) acabar(r); else { msg.classList.add('err'); msg.textContent = 'No he podido leer el código de esa foto. Haz otra más de cerca (que el código ocupe casi toda la foto), recta y sin brillos, o escribe el lote arriba.'; }
    }));
    if (cam) (async () => {
      const box = m.querySelector('.lcam'); if (!(await cargarLector()) || fin) return;
      try {
        const h5 = new Html5Qrcode('lectorCam', { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
        await h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.round(w * 0.85), height: Math.round(Math.min(h, w) * 0.45) }) }, t => acabar(t), () => { });
        box.hidden = false; parar = () => { parar = () => { }; h5.stop().catch(() => { }); };
        if (fin) parar();
      } catch { /* sin cámara en este navegador: quedan el lector y la foto */ }
    })();
  });
}

/* ---------- Etiqueta de fabricación (código del lote para arrastrarlo hasta el envasado) ----------
   Formato grande (100×150 / A6): lote, nº de quesos, código de barras y toda la trazabilidad (leche, ingredientes, operarios).
   Formatos pequeños: lote, nº de quesos y código de barras. */
const FORMATOS_FAB = { 'r100x150': { l: 'Rollo 100×150 mm · grande', w: 100, h: 150, traza: true }, 'a6': { l: 'A6 (105×148 mm) · grande', w: 105, h: 148, traza: true }, 'a4-traza': { l: 'A4 · 4 etiquetas grandes (105×148 mm)', w: 105, h: 148, cols: 2, rows: 2, a4: true, traza: true }, 'r100x60': { l: 'Rollo 100×60 mm · solo lote, quesos y código', w: 100, h: 60 }, 'r60x40': { l: 'Rollo 60×40 mm · solo lote, quesos y código', w: 60, h: 40 }, 'a4-8': { l: 'A4 · 8 etiquetas pequeñas (105×74 mm)', w: 105, h: 74, cols: 2, rows: 4, a4: true } };
/* Datos de trazabilidad de un lote para la etiqueta */
function datosFab(id) {
  const l = D.lotes.get(id); const v = D.variedades.get(l.variedadId) || {}; const tb = traceBack(id, D) || { recep: [], ingr: [] }; const cu = D.cubas.get(l.cubaId);
  return {
    id, l, v, piezas: num(l.piezas), fecha: l.fecha.slice(0, 10),
    lineas: [l.formatos ? formatosLoteTxt(l) : '', `Fabricado: ${F.d(l.fecha)}${cu ? '   ·   Cuba ' + (cu.numero ?? cu.nombre) : ''}${l.litros ? '   ·   ' + F.n(l.litros) + ' l de leche' + (l.tipoLeche ? ' de ' + l.tipoLeche : '') : ''}`,
      (l.operarios || []).length ? 'Operarios: ' + l.operarios.join(', ') : '',
      v.diasMin ? `Maduración mínima: ${v.diasMin} días → ${F.d(addDays(l.fecha, num(v.diasMin)))}` : '',
      v.vidaUtil ? `Consumo preferente: ${F.d(addDays(l.fecha, num(v.vidaUtil)))}` : ''].filter(Boolean),
    leche: tb.recep.map(x => `${x.proveedor?.nombre || '?'}${x.proveedor?.rega ? ' (REGA ' + x.proveedor.rega + ')' : ''} · entrada ${x.recepcion.id}${x.recepcion.fecha ? ' del ' + F.d(x.recepcion.fecha) : ''} · ${F.n(x.litros)} l`),
    ingr: tb.ingr.map(i => `${i.material?.nombre || '?'} · lote ${i.matLote?.loteProv || i.matLoteId} · ${F.n(i.cantidad, num(i.cantidad) % 1 ? 2 : 0)} ${i.material?.unidad || ''}${i.proveedor ? ' · ' + i.proveedor.nombre : ''}`)
  };
}

function fabPreview(id) {
  const d = datosFab(id);
  return `<div class="fabprev"><div class="fp1"><div><small>LOTE</small><b class="fpl">${esc(id)}</b><span>${esc(d.v.nombre || '')}</span></div><div class="fpq"><b>${F.n(d.piezas)}</b><small>${d.l.formatos ? 'unidades' : 'quesos'}</small></div></div>${barSvg(id, { h: 56, mod: 2 })}

ACT.etiquetaFab = arg => {

  const ids = dia ? [...D.lotes.values()].filter(l => !l.anulado && l.fecha.slice(0, 10) === dia).sort(by(l => l.fecha + l.id)).map(l => l.id) : [arg];

  let pref = S.data.config.get('empresa')?.formatoFab; if (!FORMATOS_FAB[pref]) pref = 'r100x60';
  formModal({
    title: dia ? `Etiquetas de fabricación del ${F.d(dia)}` : 'Etiqueta de fabricación del lote ' + ids[0],
    intro: `<p class="sub">Para pegar en el carro o la caja del lote. En el envasado se escanea el código y la app sabe qué lote es, sin escribirlo.</p>${dia ? `<p>${ids.length} lotes: ${ids.map(esc).join(', ')}</p>` : fabPreview(ids[0])}`,
    values: { formato: pref, copias: 1 },

    submit: '🖨 Generar PDF para imprimir',
    async onSubmit(o) {
      const fm = FORMATOS_FAB[o.formato]; const vert = fm.h > fm.w;
      const doc = fm.a4 ? pdfDoc('p', 'a4') : pdfDoc(vert ? 'p' : 'l', [fm.w, fm.h]); if (!doc) throw new Error('PDF no disponible');
      const n = Math.max(1, Math.min(50, Math.round(num(o.copias))));
      const c = cfg();
      const dib = (id, x, y, w, h) => {
        const d = datosFab(id); const s = Math.min(w / 100, (fm.traza ? h / 150 : h / 60)); const pad = 4 * s;
        doc.setDrawColor(0); doc.setLineWidth(0.2);
        // nº de quesos, recuadro a la derecha
        const qw = 30 * s, qh = (fm.traza ? 20 : 17) * s; doc.rect(x + w - pad - qw, y + pad, qw, qh);
        doc.setFont('helvetica', 'bold'); doc.setFontSize((fm.traza ? 26 : 22) * s + 2); doc.text(F.n(d.piezas), x + w - pad - qw / 2, y + pad + qh * 0.62, { align: 'center' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7 * s + 1); doc.text(d.l.formatos ? 'UNIDADES' : 'QUESOS', x + w - pad - qw / 2, y + pad + qh - 1.6 * s, { align: 'center' });
        // lote y producto
        doc.setFontSize(7 * s + 1); doc.text('LOTE', x + pad, y + pad + 3 * s);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(20 * s + 2); doc.text(id, x + pad, y + pad + 11 * s);
        doc.setFontSize(10 * s + 1.5); doc.text(doc.splitTextToSize(d.v.nombre || '', w - qw - 3 * pad)[0] || '', x + pad, y + pad + (fm.traza ? 17 : 16) * s);
        // código de barras
        const by0 = y + pad + qh + 3 * s; const bh = fm.traza ? 20 * s : Math.max(8, y + h - by0 - pad - 6 * s);
        pdfBarcode(doc, id, x + pad, by0, w - 2 * pad, bh);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7 * s + 1.5);
        if (!fm.traza) { doc.text(`${d.l.formatos ? formatosLoteTxt(d.l) + '  ·  ' : ''}Fab. ${F.d(d.l.fecha)}${d.l.litros ? '  ·  ' + F.n(d.l.litros) + ' l' : ''}`, x + w / 2, Math.min(y + h - pad, by0 + bh + 5 * s), { align: 'center' }); return; }
        let yy = by0 + bh + 6 * s; const lh = 3.4 * s + 0.4; const maxY = y + h - pad - 4 * s; const ancho = w - 2 * pad;
        const escribe = (t, neg) => { doc.setFont('helvetica', neg ? 'bold' : 'normal'); for (const ln of doc.splitTextToSize(t, ancho)) { if (yy > maxY) return false; doc.text(ln, x + pad, yy); yy += lh; } return true; };
        const bloque = (tit, xs) => { if (yy > maxY) return; yy += 1.2 * s; doc.setFontSize(8 * s + 1.5); escribe(tit.toUpperCase(), true); doc.setFontSize(7 * s + 1.3); for (const t of (xs.length ? xs : ['—'])) if (!escribe('• ' + t)) { doc.text('…', x + w - pad, maxY, { align: 'right' }); break; } };
        doc.setFontSize(7.5 * s + 1.5); for (const t of d.lineas) escribe(t);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6 * s + 1); doc.text(`${c.nombre || ''}${c.rgseaa ? ' · RGSEAA ' + c.rgseaa : ''}`, x + w / 2, y + h - pad, { align: 'center' });
      };
      const todas = ids.flatMap(id => Array(n).fill(id)).slice(0, 400);
      if (fm.a4) { const mx = (210 - fm.cols * fm.w) / 2, my = (297 - fm.rows * fm.h) / 2; todas.forEach((id, i) => { const k = i % (fm.cols * fm.rows); if (i && !k) doc.addPage(); dib(id, mx + (k % fm.cols) * fm.w, my + Math.floor(k / fm.cols) * fm.h, fm.w, fm.h); }); }
      else todas.forEach((id, i) => { if (i) doc.addPage([fm.w, fm.h], vert ? 'p' : 'l'); dib(id, 0, 0, fm.w, fm.h); });
      try { const e = S.data.config.get('empresa') || {}; if (e.formatoFab !== o.formato && S.rol === 'admin') put('config', 'empresa', { ...e, formatoFab: o.formato }, 'formato etiqueta'); } catch { }
      await guardarArchivo(`fabricacion_${dia || ids[0]}.pdf`, doc.output('blob'));
    }

};

/* Código leído que no está en la app: si es de un envase de proveedor, ofrece darle entrada ya rellena */
async function codigoNoEncontrado(c) {
  const g = gs1(c); const mat = matPorGtin(g.gtin);
  if ((g.lote || mat || (g.gtin && !g.soloProducto)) && puede('compras')) {
    const que = `${mat ? `<b>${esc(mat.nombre)}</b>` : 'Un ingrediente'}${g.lote ? ` · lote <b>${esc(g.lote)}</b>` : ''}${g.cad ? ` · caduca ${F.d(g.cad)}` : ''}`;
    if (await confirmar(`${que}<br>Este lote todavía no está dado de alta. ¿Le doy entrada ahora?`, 'Dar entrada')) {
      const prev = mat && [...D.matlotes.values()].filter(x => x.materialId === mat.id).sort(by('fecha', -1))[0];
      ACT.nuevaCompra(null, { proveedorId: prev?.proveedorId || '', lineas: [{ materialId: mat?.id || '', loteProv: g.lote || '', caducidad: g.cad || '', _gtin: g.gtin || '' }] });
    }
    return;
  }
  toast('Código leído: ' + c + ' (no lo encuentro)', 'err');
}

const _irV5 = irACodigo;
irACodigo = function (q) {
  q = String(q ?? '').trim(); if (!q) return false;
  const id = loteDeCodigo(q); if (id) { location.hash = 'lote-' + id; return true; }
  if (_irV5(q)) return true;
  const g = gs1(q); if (g.lote && _irV5(g.lote)) return true;
  if (g.gtin && !g.lote) { const ml = matLotePorCodigo(q) || [...D.matlotes.values()].filter(x => x.materialId === matPorGtin(g.gtin)?.id).sort(by('fecha', -1))[0]; if (ml) { location.hash = 'ml-' + ml.id; return true; } }
  return false;
};
/* Lector USB/Bluetooth fuera de un campo: teclas muy seguidas + Enter = código escaneado */
(() => {
  let buf = '', t0 = 0;
  document.addEventListener('keydown', e => {
    const el = e.target; if (el && (el.closest?.('input,textarea,select,[contenteditable]'))) return;
    if (MODALS.length || e.ctrlKey || e.metaKey || e.altKey) { buf = ''; return; }
    const now = performance.now(); if (now - t0 > 80) buf = ''; t0 = now;
    if (e.key === 'Enter') { if (buf.length >= 4) { const c = buf; buf = ''; e.preventDefault(); if (!irACodigo(c)) codigoNoEncontrado(c); } buf = ''; return; }
    if (e.key.length === 1) buf += e.key;
  });
})();

/* ===================== QUESOS AFINADOS (comprados para madurar) =====================
   Entrada: se compran quesos de otro productor, se pesan y entran en la cámara de maduración con su propio lote.
   Salida: cuando pasan a la cámara de frío se vuelven a pesar; la diferencia queda como merma (pérdida de peso). */
const esAfinado = l => !!l?.afinado;
function loteAfinadoId(fecha) {
  const d = new Date(fecha + 'T12:00'); const j = Math.round((d - new Date(d.getFullYear() + '-01-01T12:00')) / 864e5) + 1;
  const base = String(d.getFullYear()).slice(-1) + String(j).padStart(3, '0') + 'A'; let n = 1;
  while (D.lotes.has(base + n) || (typeof loteOcupado === 'function' && loteOcupado(base + n))) n++;
  return base + n;
}
const ubicMadur = () => [...D.ubicaciones.values()].filter(u => !u.inactivo && (u.tipo === 'camara' || /madur/i.test(u.nombre)));
const ubicFrio = () => [...D.ubicaciones.values()].filter(u => !u.inactivo && (/fr[ií]o|refrig|conserva/i.test(u.nombre) || u.tipo === 'frio'));
function afinadoDatos(l, dv) {
  const st = dv.lotes[l.id] || { ubic: {} }; const sal = l.afinado.salidas || [];
  const enMad = Object.entries(st.ubic).filter(([u]) => !ubicFrio().some(f => f.id === u) && D.ubicaciones.get(u)?.tipo !== 'frio');
  const qM = sum(enMad, ([, x]) => x.piezas), kM = r3(sum(enMad, ([, x]) => x.kg));
  const sP = sum(sal, s => num(s.piezas)), sA = r3(sum(sal, s => num(s.kgAntes))), sK = r3(sum(sal, s => num(s.kgSalida))), mer = r3(sA - sK);
  return { st, sal, enMad, qM, kM, sP, sA, sK, mer, pct: sA ? r2(mer / sA * 100) : null, dias: Math.round((new Date(hoy() + 'T12:00') - new Date(l.afinado.entrada.fecha + 'T12:00')) / 864e5) };
}

    const tabla = `<div class="tblwrap"><div class="tscroll"><table class="tbl"><thead><tr><th>Lote</th><th>Producto</th><th>Proveedor · lote</th><th>Entrada</th><th class="num">Entró</th><th class="num">Días</th><th class="num">En maduración</th><th class="num">Pasado a frío</th><th class="num">Merma</th><th></th></tr></thead><tbody>

      await put('lotes', id, { fecha: v.fecha, variedadId: v.variedadId, tipoLeche: va?.tipoLeche || '', ubicIdInicial: v.ubicId, operarios: [], litros: 0, origen: [], ingredientes: [], piezas: p, kg, pesoReal: { fecha: v.fecha, piezas: p, kg, kgPieza: r3(kp), de: 'entrada afinado' }, afinado: { proveedorId: v.proveedorId, loteProv: v.loteProv, fabProv: v.fabProv || '', entrada: { fecha: v.fecha, piezas: p, kg, ubicId: v.ubicId }, salidas: [] }, obs: v.obs || '' }, 'queso para afinar', `${p} quesos · ${kg} kg`);
      await addMov({ fecha: v.fecha + 'T' + localISO().slice(11), ambito: 'queso', tipo: 'produccion', loteId: id, ubicId: v.ubicId, piezas: p, kg, ref: { col: 'lotes', id }, nota: 'Compra para afinar · lote proveedor ' + v.loteProv });
      toast(`Lote ${id}: ${p} quesos · ${F.kg(kg)} en maduración`); setTimeout(() => { try { ACT.etiquetaFab && ACT.etiquetaFab(id); } catch (e) { console.warn(e); } }, 300);
    } });
};
ACT.salidaAfinado = id => {
  const l = D.lotes.get(id); if (!esAfinado(l)) return; const dv = DV(); const d = afinadoDatos(l, dv);
  if (!d.enMad.length) return toast('Ese lote ya no tiene quesos en maduración', 'err');
  const desde = d.enMad.sort((a, b) => b[1].piezas - a[1].piezas)[0][0]; const frio = ubicFrio()[0] || [...D.ubicaciones.values()].find(u => u.id !== desde && !u.inactivo);
  formModal({ title: `Pesar y pasar a frío · lote ${id}`, intro: `<p class="sub">${esc(D.variedades.get(l.variedadId)?.nombre || '')} · entró el ${F.d(l.afinado.entrada.fecha)} (${d.dias} días) · ${F.n(l.afinado.entrada.piezas)} quesos, ${F.kg(l.afinado.entrada.kg)}</p>`,
    values: { fecha: hoy(), desde, piezas: d.enMad.find(x => x[0] === desde)[1].piezas, hasta: frio?.id || '' },
    fields: [{ k: 'fecha', l: 'Fecha', t: 'date', req: 1 }, { k: 'desde', l: 'Sale de', t: 'select', opts: () => d.enMad.map(([u, x]) => [u, `${D.ubicaciones.get(u)?.nombre || u} (${x.piezas} quesos)`]), req: 1 },
      { k: 'piezas', l: 'Quesos que salen', t: 'number', req: 1, min: 1 }, { k: 'kg', l: 'Kilos pesados ahora', t: 'number', req: 1, scan: code => { const o = pesoDeCodigo(code); if (!(o.kg > 0)) { toast('Esa etiqueta no lleva peso', 'err'); return ''; } return String(o.kg); }, help: 'Escanea la etiqueta de la báscula o escribe los kilos.' },
      { k: 'calc', t: 'html', html: v => { const x = dv.lotes[id]?.ubic?.[v.desde]; const p = Math.round(num(v.piezas)); if (!x || !p) return ''; const antes = p >= x.piezas ? x.kg : r3(x.kg * p / x.piezas); const k = num(v.kg); return `<div class="calcbox">Al entrar pesaban <b>${F.kg(antes)}</b>${k > 0 ? ` · ahora <b>${F.kg(k)}</b> · merma <b>${F.n(antes - k, 2)} kg (${F.n((antes - k) / antes * 100, 1)} %)</b>` : ''}</div>`; } },
      { k: 'hasta', l: 'Pasa a', t: 'select', opts: () => ubicOpts(), req: 1 }],
    submit: 'Guardar y pasar', async onSubmit(v) {
      const dv2 = DV(); const x = dv2.lotes[id]?.ubic?.[v.desde]; const p = Math.round(num(v.piezas)), kg = r3(num(v.kg));
      if (!x || p < 1 || p > x.piezas) throw new Error(`En esa cámara hay ${x?.piezas || 0} quesos de este lote`); if (!(kg > 0)) throw new Error('Pon los kilos pesados');
      if (v.hasta === v.desde) throw new Error('Elige otra cámara');
      const antes = p === x.piezas ? r3(x.kg) : r3(x.kg * p / x.piezas); const mer = r3(antes - kg);
      if (mer < 0 && !(await confirmar(`Pesan más que al entrar (+${F.n(-mer, 2)} kg). ¿Está bien el peso?`, 'Sí, guardar'))) throw new Error('Revisa el peso');
      const ts = v.fecha + 'T' + localISO().slice(11); const g = newId('G');
      if (Math.abs(mer) >= 0.001) await addMov({ fecha: ts, ambito: 'queso', tipo: mer > 0 ? 'perdida_peso' : 'ajuste', loteId: id, ubicId: v.desde, piezas: 0, kg: -mer, nota: `Afinado: ${p} quesos de ${F.n(antes, 2)} a ${F.n(kg, 2)} kg` });
      await addMov({ fecha: ts, ambito: 'queso', tipo: 'traslado_out', loteId: id, ubicId: v.desde, piezas: -p, kg: -kg, grupo: g, nota: 'Afinado: pasa a frío' });
      await addMov({ fecha: ts, ambito: 'queso', tipo: 'traslado_in', loteId: id, ubicId: v.hasta, piezas: p, kg, grupo: g, nota: 'Afinado: pasa a frío' });
      const l2 = D.lotes.get(id); const dias = Math.round((new Date(v.fecha + 'T12:00') - new Date(l2.afinado.entrada.fecha + 'T12:00')) / 864e5);
      const sal = [...(l2.afinado.salidas || []), { fecha: v.fecha, piezas: p, kgAntes: antes, kgSalida: kg, merma: mer, pct: r2(mer / antes * 100), dias, desde: v.desde, hasta: v.hasta }];
      await put('lotes', id, { ...l2, afinado: { ...l2.afinado, salidas: sal }, pesoReal: { fecha: v.fecha, piezas: p, kg, kgPieza: r3(kg / p), de: 'salida afinado' } }, 'afinado a frío', `${p} quesos · ${kg} kg · merma ${mer} kg`);
      toast(`Lote ${id}: ${p} quesos a ${D.ubicaciones.get(v.hasta)?.nombre || ''} · merma ${F.n(mer, 2)} kg (${F.n(mer / antes * 100, 1)} %)`);
    } });
};
function afinadoLoteHtml(id) {
  const l = D.lotes.get(id); if (!esAfinado(l)) return ''; const a = l.afinado;
  return card('🧀 Queso comprado para afinar', `<p>Proveedor <b>${esc(D.proveedores.get(a.proveedorId)?.nombre || '—')}</b> · lote del proveedor <b>${esc(a.loteProv || '—')}</b>${a.fabProv ? ` · fabricado ${F.d(a.fabProv)}` : ''}</p><p>Entró el ${F.d(a.entrada.fecha)}: ${F.n(a.entrada.piezas)} quesos · ${F.kg(a.entrada.kg)}</p>` +
    ((a.salidas || []).length ? `<table class="tbl"><thead><tr><th>Pasó a frío</th><th class="num">Quesos</th><th class="num">Kg al entrar</th><th class="num">Kg al salir</th><th class="num">Merma</th><th class="num">Días</th></tr></thead><tbody>${a.salidas.map(s => `<tr><td>${F.d(s.fecha)}</td><td class="num">${F.n(s.piezas)}</td><td class="num">${F.n(s.kgAntes, 2)}</td><td class="num">${F.n(s.kgSalida, 2)}</td><td class="num"><b>${F.n(s.merma, 2)} kg · ${F.n(s.pct, 1)} %</b></td><td class="num">${s.dias}</td></tr>`).join('')}</tbody></table>` : `<p class="sub">Aún en maduración. ${btn('salidaAfinado', '⚖ Pesar y pasar a frío', 'sm primary', id)}</p>`));
}

/* ===================== LEER LA ETIQUETA (SIN CÓDIGO DE BARRAS) =====================
   Para el cuajo, el cloruro cálcico, el ácido láctico… que no traen código.
   Se hace una foto a la etiqueta, el móvil lee el texto (Tesseract, gratis y sin servidor)
   y la app saca el ingrediente, el proveedor, el lote, la caducidad y el tamaño del envase.
   Siempre se enseña lo leído para revisarlo antes de ponerlo en la entrada. */
const OCR_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const MESES_ET = { ENE: 1, JAN: 1, FEB: 2, MAR: 3, ABR: 4, APR: 4, MAY: 5, JUN: 6, JUL: 7, AGO: 8, AUG: 8, SEP: 9, SET: 9, OCT: 10, NOV: 11, DIC: 12, DEC: 12 };
/* Otros nombres con los que salen los ingredientes en las etiquetas */
const SIN_ET = { cuajo: ['RENNET', 'QUIMOSINA', 'CHYMOSIN', 'CHY', 'CAGLIO', 'PRESURE'], cloruro: ['CALCIUM CHLORIDE', 'CACL2', 'CLORURO DE CALCIO', 'CALCIO'], calcico: ['CALCIUM', 'CALCIO', 'CACL2'], lactico: ['LACTIC', 'E270', 'E-270'], acido: ['ACID', 'ACIDO'], sal: ['SALT', 'NACL', 'SODIUM CHLORIDE', 'CLORURO SODICO', 'CLORURO DE SODIO'], fermento: ['CULTURE', 'CULTIVO', 'STARTER', 'FERMENT'] };
const PAL_COMUNES = new Set('LOTE LOT BATCH CADUCIDAD CONSUMIR PREFERENTEMENTE ANTES FECHA PRODUCTO INGREDIENTES CONSERVAR LUGAR FRESCO SECO TEMPERATURA ENTRE CONTENIDO NETO PESO VOLUMEN LITROS LITRO USO ALIMENTARIO INDUSTRIAL MANTENER ALCANCE NINOS PELIGRO ATENCION CONTIENE FABRICADO ENVASADO SPAIN ESPANA EXPIRY BEFORE BEST DATE PRODUCTION STORE KEEP WITH FROM THE AND PARA CON POR DEL LAS LOS UNA'.split(' '));
const sinAcET = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const finMes = (y, m) => new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
const anio4 = y => { y = +y; return y < 100 ? 2000 + y : y; };
/* Todas las fechas que aparecen en el texto, con su posición */
function fechasEtiqueta(t) {
  const out = []; const ok = (y, m, d) => y >= 2015 && y <= 2050 && m >= 1 && m <= 12 && (!d || (d >= 1 && d <= 31));
  const add = (i, y, m, d) => { if (ok(y, m, d)) out.push({ i, f: d ? `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` : finMes(y, m) }); };
  let r;
  const reISO = /\b(20\d\d)[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/g; while ((r = reISO.exec(t))) add(r.index, +r[1], +r[2], +r[3]);
  const reDMY = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})\b/g; while ((r = reDMY.exec(t))) add(r.index, anio4(r[3]), +r[2], +r[1]);
  const reMY = /(?<![\d\/\-.])(\d{1,2})[\/\-.](20\d\d|\d{2})(?![\d\/\-.])/g; while ((r = reMY.exec(t))) if (!out.some(o => Math.abs(o.i - r.index) < 6)) add(r.index, anio4(r[2]), +r[1], 0);
  const reMes = /\b(?:(\d{1,2})[\s\/\-.]*)?(ENE|JAN|FEB|MAR|ABR|APR|MAY|JUN|JUL|AGO|AUG|SEP|SET|OCT|NOV|DIC|DEC)[A-Z]*[\s\/\-.]*(20\d\d|\d{2})\b/g; while ((r = reMes.exec(t))) add(r.index, anio4(r[3]), MESES_ET[r[2]], r[1] ? +r[1] : 0);
  return out.sort((a, b) => a.i - b.i);
}
/* Saca de un texto leído: lote, caducidad, ingrediente, proveedor y tamaño del envase */
function analizarEtiqueta(texto) {
  const t = sinAcET(texto).replace(/[|]/g, 'I').replace(/[ \t]+/g, ' ');
  const o = { texto: String(texto || '').trim() };
  // Lote: «LOTE: 12345», «LOT 24A17», «L: 2405», «BATCH 77-B», «Nº LOTE …»
  const mL = t.match(/\b(?:N[O°º]?\s*(?:DE\s*)?LOTE|LOTE|LOT(?:E|\.)?|BATCH(?:\s*NO?\.?)?|CHARGE)\s*(?:N[O°º.]*)?\s*[:.#\-]?\s*([A-Z0-9][A-Z0-9\-\/.]{1,24})/) || t.match(/(?:^|\s)L\s*[:.]+\s*([A-Z0-9][A-Z0-9\-\/.]{1,24})/);
  if (mL && /\d/.test(mL[1])) o.lote = mL[1].replace(/[.\-\/]+$/, '');
  // Caducidad: la fecha que va detrás de CAD / EXP / BEST BEFORE…; si no, la más lejana
  const fs = fechasEtiqueta(t); const hoyS = hoy();
  const mC = /(CADUCIDAD|CAD\b|F\.?\s*CAD|CONSUMIR PREF|CONSUMIR ANTES|EXP\b|EXPIRY|EXPIRA|BEST BEFORE|BBD|USE BY|VTO|VENCE|VENCIMIENTO|DLUO|DLC|SCAD|MHD)/.exec(t);
  const tras = mC ? fs.find(f => f.i > mC.index && f.i - mC.index < 60) : null;
  const futuras = fs.filter(f => f.f >= hoyS).sort((a, b) => a.f < b.f ? 1 : -1);
  const c = tras || futuras[0] || null; if (c) o.caducidad = c.f;
  if (o.lote && fs.some(f => t.slice(f.i, f.i + o.lote.length) === o.lote)) delete o.lote; // el «lote» era una fecha
  // Ingrediente: el que más palabras de su nombre (o de las que ya aprendió) aparezcan
  const pal = new Set(t.split(/[^A-Z0-9]+/).filter(Boolean)); const tiene = w => w.includes(' ') ? t.includes(w) : pal.has(w);
  let best = null;
  for (const m of D.materiales.values()) {
    if (m.inactivo) continue;
    const ws = sinAcET(m.nombre).split(/[^A-Z0-9]+/).filter(w => w.length >= 3 && !['DEL', 'LAS', 'LOS', 'PARA', 'CON'].includes(w));
    let s = 0; for (const w of ws) { if (tiene(w)) s += 2; else if ((SIN_ET[w.toLowerCase()] || []).some(tiene)) s += 1.5; }
    for (const w of m.palabrasEtiqueta || []) if (tiene(w)) s += 1;
    if (m.gtin && t.replace(/\D/g, '').includes(String(m.gtin))) s += 5;
    if (s > 0 && (!best || s > best.s)) best = { s, id: m.id };
  }
  if (best) o.materialId = best.id;
  // Proveedor
  for (const p of D.proveedores.values()) { if ((p.tipos || []).every(x => x === 'leche')) continue; const ws = sinAcET(p.nombre).split(/[^A-Z0-9]+/).filter(w => w.length >= 4 && !['SOCIEDAD', 'LIMITADA', 'ANONIMA'].includes(w)); if (ws.length && ws.some(tiene)) { o.proveedorId = p.id; break; } }
  // Tamaño del envase: «5 L», «25 LITROS», «1000 ML», «25 KG»
  const mV = t.match(/\b(\d{1,4}(?:[.,]\d{1,3})?)\s*(LITROS?|LTS?|L|ML|CC|KG|KILOS?|G|GR)\b/);
  if (mV) { const n = num(mV[1].replace(',', '.')); const u = mV[2]; const ml = /^L/.test(u) ? n * 1000 : /ML|CC/.test(u) ? n : 0; const g = /^K/.test(u) ? n * 1000 : /^G/.test(u) ? n : 0; if (n > 0) o.envase = ml ? { ml, txt: `${F.n(n)} ${/^L/.test(u) ? 'l' : 'ml'}` } : { g, txt: `${F.n(n)} ${/^K/.test(u) ? 'kg' : 'g'}` }; }
  return o;
}
/* Unidad de entrada que cuadra con el tamaño leído (p. ej. «garrafas de 5 l») */
function udDeEnvase(m, env) {
  if (!m || !env) return ''; const q = env.ml || env.g; const us = unidadesEntrada(m);
  if (['ml', 'g'].includes(m.unidad)) return (us.find(x => x[2] === q) || [''])[0];
  if (['l', 'kg'].includes(m.unidad)) return (us.find(x => x[2] === q / 1000) || [''])[0];
  return '';
}
/* Palabras propias de la etiqueta para reconocer el ingrediente la próxima vez */
function palabrasDistintivas(texto, o) {
  const fuera = new Set([o.lote].filter(Boolean).map(sinAcET));
  return [...new Set(sinAcET(texto).split(/[^A-Z]+/).filter(w => w.length >= 5 && !PAL_COMUNES.has(w) && !fuera.has(w)))].slice(0, 8);
}
/* Prepara la foto para leer mejor: tamaño medio, en gris y con más contraste */
function fotoParaOCR(img) {
  const { cv, L, w, h } = lienzo(img, { max: 2000 }); const cx = cv.getContext('2d'); const id = cx.getImageData(0, 0, w, h); const d = id.data;
  let lo = 255, hi = 0; for (let i = 0; i < L.length; i += 7) { if (L[i] < lo) lo = L[i]; if (L[i] > hi) hi = L[i]; }
  const k = hi > lo ? 255 / (hi - lo) : 1; for (let i = 0, j = 0; i < L.length; i++, j += 4) { const v = Math.max(0, Math.min(255, (L[i] - lo) * k)); d[j] = d[j + 1] = d[j + 2] = v; }
  cx.putImageData(id, 0, 0); return cv;
}
let _ocrP = null;
async function ocrTexto(file, aviso) {
  const img = await abrirImagen(file); if (!img) throw new Error('No se ha podido abrir la foto');
  if (window.__ocrPrueba) return window.__ocrPrueba(file);
  if (!window.Tesseract) { aviso('Preparando el lector de texto (la primera vez tarda un poco)…'); await cargarScript(OCR_URL); }
  if (!_ocrP) _ocrP = Tesseract.createWorker(['spa', 'eng'], 1, { logger: m => { if (m.status === 'recognizing text') aviso(`Leyendo la etiqueta… ${Math.round((m.progress || 0) * 100)} %`); } }).catch(e => { _ocrP = null; throw e; });
  const w = await _ocrP; aviso('Leyendo la etiqueta…');
  const r = await w.recognize(fotoParaOCR(img)); return r?.data?.text || '';
}
/* Ventana para hacer la foto y leerla. Devuelve lo analizado o null */
function leerEtiqueta() {
  return new Promise(res => {
    let fin = false;
    const m = modal(`<h3>📷 Leer la etiqueta</h3><p class="sub">Para los productos que no traen código de barras (cuajo, cloruro cálcico, ácido láctico…). Haz la foto de cerca, recta, con buena luz y que se vea el lote y la caducidad.</p>
      <div class="lfoto"><label class="btn big primary">📷 Hacer foto a la etiqueta<input type="file" accept="image/*" capture="environment" hidden></label><label class="btn">🖼 Elegir una foto<input type="file" accept="image/*" hidden></label></div>
      <p class="lmsg sub" aria-live="polite"></p>`, { onClose: () => { if (!fin) res(null); } });
    const msg = m.querySelector('.lmsg'); const aviso = t => { msg.textContent = t; };
    m.querySelectorAll('input[type=file]').forEach(inp => inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
      m.querySelectorAll('.lfoto .btn').forEach(b => { b.style.opacity = .5; b.style.pointerEvents = 'none'; });
      try {
        const txt = await ocrTexto(f, aviso);
        if (!txt.trim()) { aviso('No se ha leído ningún texto. Prueba otra foto más cerca y con más luz.'); return; }
        fin = true; m.close(); res(analizarEtiqueta(txt));
      } catch (e) { console.error(e); aviso('No se ha podido leer (¿sin internet la primera vez?). Prueba otra vez o escríbelo a mano.'); }
      finally { m.querySelectorAll('.lfoto .btn').forEach(b => { b.style.opacity = ''; b.style.pointerEvents = ''; }); }
    }));
  });
}
/* Desde «Entrada de lotes»: foto → revisar lo leído → se añade como una línea */
async function etiquetaACompra(form) {
  const o = await leerEtiqueta(); if (!o || !document.body.contains(form)) return;
  const provSel = form.querySelector('[data-k=proveedorId]');
  const vals = { materialId: o.materialId || '', proveedorId: (provSel && !provSel.value && o.proveedorId) || '', loteProv: o.lote || '', caducidad: o.caducidad || '', cantidad: 1, ud: udDeEnvase(D.materiales.get(o.materialId), o.envase) };
  const leido = [o.materialId ? '' : 'el ingrediente', o.lote ? '' : 'el lote', o.caducidad ? '' : 'la caducidad'].filter(Boolean);
  formModal({
    title: 'Revisa lo leído de la etiqueta', values: vals,
    intro: `<p class="sub">${leido.length ? `No he encontrado ${leido.join(', ').replace(/, ([^,]*)$/, ' ni $1')}: complétalo tú. ` : ''}Comprueba que todo está bien antes de añadirlo.${o.envase ? ` En la etiqueta pone <b>${esc(o.envase.txt)}</b>.` : ''}</p>`,
    fields: [
      { k: 'materialId', l: 'Ingrediente', t: 'select', opts: () => opts('materiales', m => !m.inactivo, m => `${m.nombre} (${m.unidad})`), req: 1 },
      ...(provSel && !provSel.value ? [{ k: 'proveedorId', l: 'Proveedor', t: 'select', opts: () => opts('proveedores', p => (p.tipos || []).some(t => t !== 'leche')) }] : []),
      { k: 'loteProv', l: 'Lote', req: 1 }, { k: 'caducidad', l: 'Caducidad', t: 'date' },
      { k: 'cantidad', l: 'Cuántos envases iguales llegan', t: 'number', req: 1, min: 0.0001 },
      { k: 'ud', l: 'En', t: 'select', dep: ['materialId'], opts: v => unidadesEntrada(D.materiales.get(v.materialId)).map(x => [x[0], x[1]]) },
      { k: 'txt', t: 'html', full: 1, html: `<details class="sub"><summary>Texto leído de la foto</summary><pre style="white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto">${esc(o.texto)}</pre></details>` }],
    submit: 'Añadir a la entrada',
    async onSubmit(v) {
      const linea = { materialId: v.materialId, loteProv: String(v.loteProv).trim(), caducidad: v.caducidad, cantidad: v.cantidad, ud: v.ud };
      form.dispatchEvent(new CustomEvent('rellenar', { detail: { k: 'lineas', row: linea, values: v.proveedorId ? { proveedorId: v.proveedorId } : {} } }));
      // Aprende cómo se llama este ingrediente en su etiqueta
      const mat = D.materiales.get(v.materialId); const nuevas = palabrasDistintivas(o.texto, o).filter(w => !(mat.palabrasEtiqueta || []).includes(w));
      if (mat && nuevas.length) { try { await put('materiales', mat.id, { ...mat, palabrasEtiqueta: [...(mat.palabrasEtiqueta || []), ...nuevas].slice(-24) }, 'ingrediente', mat.nombre); } catch { } }
      toast('Añadido. Revisa la cantidad y guarda la entrada.');
    }
  });
}
